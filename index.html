<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#123B2A" />
    <meta name="description" content="Thayil Cardamom Spices — Records & Billing" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <title>Thayil Cardamom Spices</title>
    <style>
      html,body,#root{min-height:100%;margin:0}
      body{background:#fdfcf6;color:#1f2b24;font-family:system-ui,sans-serif}
      .boot-shell{display:flex;min-height:100vh}
      .boot-main{flex:1;padding:1rem}
      .boot-bar{height:3.5rem;background:#fffcf7;border-bottom:1px solid #dce6de}
      .boot-card{height:5.5rem;border-radius:1rem;background:#eaf0e6;margin-top:.75rem;animation:pulse 1.2s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
    </style>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('thayil-theme');
          var dark = saved === 'dark';
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div class="boot-shell" aria-busy="true">
        <div class="boot-main">
          <div class="boot-bar"></div>
          <div class="boot-card" style="height:7rem"></div>
          <div class="boot-card"></div>
          <div class="boot-card"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
